[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai-legacy-reference"
version = "0.1.0"
description = "Public legacy/reference implementation of the Atlas AI content pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "uvicorn>=0.30,<1",
]
ai = ["crewai>=0.102", "langchain-google-genai>=2,<4", "python-dotenv>=1,<2"]
video = ["moviepy>=1,<3", "requests>=2.32,<3"]
audio = ["gTTS>=2.5,<3"]
youtube = [
  "google-api-python-client>=2.140,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
]
whisper = ["openai-whisper>=20231117"]
dev = ["pytest>=8,<9", "requests>=2.32,<3"]

[tool.setuptools]
packages = ["atlas_core", "examples", "providers", "publisher"]
py-modules = [
  "analytics_engine",
  "api_server",
  "auth",
  "ceo_engine",
  "config_manager",
  "editor_engine",
  "main_factory",
  "metadata_engine",
  "motion_engine",
  "retry_system",
  "safety_engine",
  "script_engine",
  "storyboard_engine",
  "subtitle_engine",
  "thumbnail_engine",
  "translation_engine",
  "video_engine",
  "voice_engine",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
